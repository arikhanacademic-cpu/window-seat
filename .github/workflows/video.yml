# Renders a ~35 second promo film of the live site, with the site's own lofi as the soundtrack.
# Run it from the Actions tab: "Render video" → Run workflow. When it finishes (about 1–3 hours,
# because GitHub's machines have no graphics card), download "window-seat-video" from the run page.
name: Render video

on:
  workflow_dispatch:
    inputs:
      size:
        description: "Resolution"
        type: choice
        options: ["1280x720", "1600x900", "1920x1080"]
        default: "1280x720"
      weather:
        description: "Weather in the film (leave empty for the real weather right now)"
        type: choice
        options: ["clear", "cloudy", "snow", "fog", ""]
        default: "clear"
      speed:
        description: "How much faster than real time the train moves"
        default: "3"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm i --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          WEATHER: ${{ inputs.weather }}
          SPEED: ${{ inputs.speed }}
        run: |
          export W=${{ inputs.size }}; export H=${W#*x}; export W=${W%x*}
          node video/render-video.mjs
      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-seat-video
          path: |
            video/out/window-seat.mp4
            video/out/shot*.mp4
          if-no-files-found: warn
